[versions]
kotlin = "2.4.20"

gradlePublishPlugin = "2.2.1"

junit = "6.1.3"

kotest = "6.2.5"

[libraries]

plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

test-junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
test-junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
test-junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
test-kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
gradle-publish = { id = "com.gradle.plugin-publish", version.ref = "gradlePublishPlugin" }
